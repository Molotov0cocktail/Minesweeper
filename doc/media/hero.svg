<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">Minesweeper 经典扫雷</title><desc id="desc">深蓝银灰品牌封面，沿用扫雷应用图标，展示逻辑推理、自由操作与Windows桌面体验。</desc>
<defs><linearGradient id="hero-bg" x2="1" y2="1"><stop stop-color="#0c1c30"/><stop offset="1" stop-color="#1b3c59"/></linearGradient><radialGradient id="hero-glow"><stop stop-color="#729cbf" stop-opacity=".24"/><stop offset="1" stop-color="#729cbf" stop-opacity="0"/></radialGradient><pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d6e6f2" stroke-opacity=".045"/></pattern></defs>
<rect width="1280" height="500" rx="24" fill="url(#hero-bg)"/><rect width="1280" height="500" rx="24" fill="url(#hero-grid)"/>
<circle cx="1010" cy="206" r="280" fill="url(#hero-glow)"/><path d="M64 58H104" stroke="#8bb8d6" stroke-width="3"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<text x="118" y="64" fill="#9cb4c9" font-size="15" letter-spacing="3">DESKTOP CLASSIC · v1.6.0</text>
<text x="60" y="174" fill="#f3f7fb" font-size="78" font-weight="700" letter-spacing="-3">Minesweeper</text>
<text x="64" y="231" fill="#d3e2ed" font-size="29" font-weight="500">经典扫雷，更从容的每一步。</text>
<text x="64" y="279" fill="#97afc3" font-size="18">逻辑推理 · 自由缩放 · 手柄操作 · 专注视图</text>
<rect x="64" y="317" width="158" height="38" rx="19" fill="#e6eff6"/><text x="143" y="342" text-anchor="middle" fill="#17344d" font-size="14" font-weight="600">Windows 桌面版</text>
<line x1="64" y1="402" x2="1216" y2="402" stroke="#57758e" stroke-opacity=".4"/>
<text x="64" y="449" fill="#eef4f8" font-size="15" font-weight="600" letter-spacing="1.5">LOGIC FIRST</text><text x="213" y="449" fill="#8da7bc" font-size="14">局部修复防猜测</text>
<line x1="440" y1="429" x2="440" y2="457" stroke="#57758e" stroke-opacity=".5"/>
<text x="475" y="449" fill="#eef4f8" font-size="15" font-weight="600" letter-spacing="1.5">YOUR CONTROLS</text><text x="664" y="449" fill="#8da7bc" font-size="14">鼠标 / 键盘 / 手柄</text>
<line x1="907" y1="429" x2="907" y2="457" stroke="#57758e" stroke-opacity=".5"/>
<text x="944" y="449" fill="#eef4f8" font-size="15" font-weight="600" letter-spacing="1.5">STAY FOCUSED</text>
</g>
<rect x="887" y="76" width="272" height="272" rx="54" fill="#05111e" fill-opacity=".24" transform="rotate(9 1023 212)"/>
<g transform="translate(879 62) scale(0.546875)" fill="none">
  <defs>
    <linearGradient id="case" x1="68" y1="40" x2="442" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315d85"/>
      <stop offset=".48" stop-color="#193c5e"/>
      <stop offset="1" stop-color="#0b2037"/>
    </linearGradient>
    <linearGradient id="tile" x1="92" y1="90" x2="405" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f5f8"/>
      <stop offset=".47" stop-color="#cbd5dc"/>
      <stop offset="1" stop-color="#9aaab7"/>
    </linearGradient>
    <linearGradient id="steel" x1="145" y1="126" x2="352" y2="381" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7f98ac"/>
      <stop offset=".28" stop-color="#354c60"/>
      <stop offset="1" stop-color="#101d2b"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0" cy="0" r="1" gradientTransform="translate(220 211) rotate(49) scale(158)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8bbc9"/>
      <stop offset=".22" stop-color="#607d92"/>
      <stop offset=".56" stop-color="#273f53"/>
      <stop offset="1" stop-color="#0a1623"/>
    </radialGradient>
    <linearGradient id="rim" x1="186" y1="170" x2="334" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d3dfe7"/>
      <stop offset=".42" stop-color="#778e9f"/>
      <stop offset="1" stop-color="#152637"/>
    </linearGradient>
  </defs>

  <!-- 透明外边与深蓝机壳，保留小尺寸轮廓。 -->
  <rect x="20" y="24" width="472" height="468" rx="104" fill="#091b2d"/>
  <rect x="24" y="20" width="464" height="464" rx="100" fill="url(#case)" stroke="#547a9b" stroke-width="6"/>
  <path d="M65 117C69 79 91 56 130 52H382" stroke="#8cabbe" stroke-opacity=".34" stroke-width="7" stroke-linecap="round"/>

  <!-- 四格银色浮雕棋盘：一体的亮上沿和暗下沿。 -->
  <rect x="76" y="80" width="360" height="360" rx="20" fill="#0d253b"/>
  <rect x="86" y="86" width="166" height="166" rx="7" fill="url(#tile)"/>
  <rect x="260" y="86" width="166" height="166" rx="7" fill="url(#tile)"/>
  <rect x="86" y="260" width="166" height="166" rx="7" fill="url(#tile)"/>
  <rect x="260" y="260" width="166" height="166" rx="7" fill="url(#tile)"/>
  <path d="M94 244V94H244M268 244V94H418M94 418V268H244M268 418V268H418" stroke="#ffffff" stroke-opacity=".8" stroke-width="7"/>
  <path d="M94 248H248V94M268 248H422V94M94 422H248V268M268 422H422V268" stroke="#788c9c" stroke-width="8"/>

  <!-- 八向短刺与球体共享金属明暗，尖刺保持完整的八方向剪影。 -->
  <path d="M256 119V170M256 342V393M119 256H170M342 256H393M159 159L195 195M317 317L353 353M159 353L195 317M317 195L353 159"
        stroke="#102031" stroke-width="32" stroke-linecap="round"/>
  <path d="M256 119V170M256 342V393M119 256H170M342 256H393M159 159L195 195M317 317L353 353M159 353L195 317M317 195L353 159"
        stroke="url(#steel)" stroke-width="23" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="103" fill="#0c1926"/>
  <circle cx="256" cy="256" r="96" fill="url(#sphere)" stroke="url(#rim)" stroke-width="5"/>
  <path d="M183 234C190 205 211 187 237 182" stroke="#e8f0f5" stroke-opacity=".65" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="222" cy="215" rx="18" ry="13" transform="rotate(-36 222 215)" fill="#edf5fa" fill-opacity=".91"/>
  <path d="M302 318C313 309 321 299 325 285" stroke="#6f8b9e" stroke-opacity=".44" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>